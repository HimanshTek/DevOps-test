services:
 api:
  build: .
  ports:
    - "3000:3000"
  environment:
    - DB_HOST=db
    - DB_PORT=5432
    - DB_NAME=myapp
    - DB_USER=admin
    - DB_PASS=secret
  depends_on:
    - db
    
 db:
  image: postgres:16
  ports:
    - "5432:5432"
  environment: 
    - POSTGRES_DB=myapp
    - POSTGRES_USER=admin
    - POSTGRES_PASSWORD=secret
  volumes:
    - pgdata:/var/lib/postgresql/data
 
 
volumes:
  pgdata:
